<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Hospital Appointment System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">🏥 HMS</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="register.html" class="active">Register</a>
                <a href="dashboard.html">Dashboard</a>
            </div>
        </nav>
    </header>

    <!-- Registration Form -->
    <div class="form-container">
        <h2>Patient Registration</h2>
        <form onsubmit="return validateRegister()">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" placeholder="Enter your full name">
                <div class="error" id="reg-name-error"></div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="Enter your email">
                <div class="error" id="reg-email-error"></div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="reg-phone" placeholder="10-digit phone number">
                <div class="error" id="reg-phone-error"></div>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" id="reg-dob">
                <div class="error" id="reg-dob-error"></div>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select id="reg-gender">
                    <option value="">Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea id="reg-address" rows="3" placeholder="Enter your address"></textarea>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Min 6 characters">
                <div class="error" id="reg-password-error"></div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="reg-confirm-password" placeholder="Re-enter password">
                <div class="error" id="reg-confirm-password-error"></div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
        </form>
        <p style="text-align:center; margin-top:15px; font-size:14px;">
            Already have an account? <a href="login.html" style="color:#1a73e8;">Login here</a>
        </p>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Hospital Appointment System.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
