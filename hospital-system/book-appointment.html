<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - Hospital Appointment System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">🏥 HMS</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="book-appointment.html" class="active">Book Appointment</a>
                <a href="appointments.html">My Appointments</a>
                <a href="login.html">Logout</a>
            </div>
        </nav>
    </header>

    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h3>Patient Panel</h3>
            <ul>
                <li><a href="book-appointment.html" class="active">📅 Book Appointment</a></li>
                <li><a href="appointments.html">📋 My Appointments</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="form-container" style="max-width: 700px;">
                <h2>Book an Appointment</h2>
                <form onsubmit="return validateAppointment()">

                    <div class="form-group">
                        <label>Select Doctor</label>
                        <select id="appt-doctor">
                            <option value="">-- Choose a doctor --</option>
                            <option value="1">Dr. Ahmed Khan - Cardiology</option>
                            <option value="2">Dr. Fatima Riaz - Dermatology</option>
                            <option value="3">Dr. Hassan Ali - Neurology</option>
                            <option value="4">Dr. Usman Malik - Orthopedics</option>
                        </select>
                        <div class="error" id="appt-doctor-error"></div>
                    </div>

                    <div class="form-group">
                        <label>Select Date</label>
                        <input type="date" id="appt-date">
                        <div class="error" id="appt-date-error"></div>
                    </div>

                    <div class="form-group">
                        <label>Select Time Slot</label>
                        <div class="time-slots">
                            <label class="time-slot"><input type="radio" name="time" value="09:00 AM" hidden> 09:00 AM</label>
                            <label class="time-slot"><input type="radio" name="time" value="09:30 AM" hidden> 09:30 AM</label>
                            <label class="time-slot"><input type="radio" name="time" value="10:00 AM" hidden> 10:00 AM</label>
                            <label class="time-slot"><input type="radio" name="time" value="10:30 AM" hidden> 10:30 AM</label>
                            <label class="time-slot booked"><input type="radio" name="time" value="11:00 AM" hidden disabled> 11:00 AM</label>
                            <label class="time-slot"><input type="radio" name="time" value="11:30 AM" hidden> 11:30 AM</label>
                            <label class="time-slot"><input type="radio" name="time" value="02:00 PM" hidden> 02:00 PM</label>
                            <label class="time-slot"><input type="radio" name="time" value="02:30 PM" hidden> 02:30 PM</label>
                            <label class="time-slot booked"><input type="radio" name="time" value="03:00 PM" hidden disabled> 03:00 PM</label>
                            <label class="time-slot"><input type="radio" name="time" value="03:30 PM" hidden> 03:30 PM</label>
                            <label class="time-slot"><input type="radio" name="time" value="04:00 PM" hidden> 04:00 PM</label>
                            <label class="time-slot"><input type="radio" name="time" value="04:30 PM" hidden> 04:30 PM</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Reason for Visit</label>
                        <textarea id="appt-reason" rows="3" placeholder="Briefly describe your symptoms or reason"></textarea>
                        <div class="error" id="appt-reason-error"></div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width:100%;">Book Appointment</button>
                </form>
            </div>
        </main>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Hospital Appointment System.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
