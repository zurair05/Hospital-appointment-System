<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital Appointment System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">🏥 HMS</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html" class="active">Login</a>
                <a href="register.html">Register</a>
                <a href="dashboard.html">Dashboard</a>
            </div>
        </nav>
    </header>

    <!-- Login Forms -->
    <div class="form-container">
        <h2>Patient Login</h2>
        <form onsubmit="return validateLogin(this)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="Enter your email">
                <div class="error" id="login-email-error"></div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter password">
                <div class="error" id="login-password-error"></div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
        </form>
        <p style="text-align:center; margin-top:15px; font-size:14px;">
            Don't have an account? <a href="register.html" style="color:#1a73e8;">Register here</a>
        </p>
    </div>

    <!-- Admin Login -->
    <div class="form-container" style="margin-top:20px;">
        <h2>Admin Login</h2>
        <form onsubmit="return validateLogin(this)">
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="admin-email" placeholder="Enter admin email">
                <div class="error" id="admin-email-error"></div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="admin-password" placeholder="Enter password">
                <div class="error" id="admin-password-error"></div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Login as Admin</button>
        </form>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Hospital Appointment System.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
